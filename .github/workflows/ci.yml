name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so Biome can diff changed files against the base ref.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Blocking gate: only the files changed in this PR/push must be clean.
      # This stops new formatting/lint debt without forcing a repo-wide reformat
      # of the pre-existing debt (tracked in a separate Biome cleanup PR).
      - name: Biome check (changed files)
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -n "$BASE" ] && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "Checking files changed since ${BASE}"
            bunx biome ci --changed --since="${BASE}" --no-errors-on-unmatched .
          else
            echo "No usable base ref (new branch / initial commit); skipping scoped check."
          fi

      # Informational only: full-repo check keeps the pre-existing debt visible
      # in logs without failing the build. Remove once the cleanup PR lands.
      - name: Biome check (full repo, non-blocking)
        continue-on-error: true
        run: bun check

      - name: Run tests
        run: bun test
